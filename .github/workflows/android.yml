name: Android app
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "style.css"
      - "app.js"
      - "icons/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "DAILIES_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set, signing with a throwaway debug key"
          fi
      - name: Build APK
        env:
          DAILIES_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dailies.apk
          gh release view android >/dev/null 2>&1 || \
            gh release create android --title "Android app" --notes "Latest build of the Dailies Android app. Download dailies.apk and open it on your phone to install." --latest
          gh release upload android dailies.apk --clobber
