<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dailies</title>
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dailies">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Dailies</h1>
        <p class="date" id="date"></p>
      </div>
      <div class="progress" aria-live="polite">
        <span id="count">0/0</span>
        <div class="bar"><div id="fill"></div></div>
      </div>
    </header>

    <ol class="games" id="games"></ol>
    <div class="empty" id="empty" hidden>
      <p>No games yet.</p>
      <button class="ghost" id="emptyAdd">Add a game</button>
    </div>

    <footer>
      <div class="actions">
        <button class="ghost" id="next">Next unplayed <kbd>N</kbd></button>
        <button class="ghost" id="edit">Edit games</button>
      </div>
      <a class="ghost" id="android" hidden href="https://github.com/Lenni707/dailies/releases/download/android/dailies.apk">Android app</a>
      <span class="hint">Keys <kbd>1</kbd>–<kbd id="maxkey">5</kbd> open a game · resets at midnight</span>
    </footer>

    <section class="cal" aria-label="History">
      <div class="cal-head">
        <h2>History</h2>
        <span class="stats" id="calStats"></span>
      </div>
      <div class="cal-body">
        <div class="daynames"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
        <div class="scroller" id="scroller">
          <div class="months" id="months"></div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
      <div class="legend">
        <span>Less</span>
        <i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><i data-l="5"></i>
        <span>More</span>
      </div>
      <div class="detail">
        <span id="dayLabel"></span>
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <dialog class="editor" id="editor" aria-labelledby="editorTitle">
      <div class="editor-head">
        <h2 id="editorTitle">Games</h2>
        <button class="icon" id="closeEditor" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
      <ul class="edit-list" id="editList"></ul>
      <form id="addForm" class="add-form" autocomplete="off">
        <h3>Add a game</h3>
        <input name="name" placeholder="Name" required maxlength="40">
        <input name="url" placeholder="Link, e.g. nytimes.com/games/connections" required inputmode="url" maxlength="300">
        <input name="blurb" placeholder="Short description (optional)" maxlength="60">
        <div class="form-row">
          <span class="note" id="formNote"></span>
          <button class="primary" type="submit">Add</button>
        </div>
      </form>
    </dialog>

    <div class="tip" id="tip" role="tooltip" hidden></div>
    <div class="toast" id="toast" role="status" hidden>
      <span id="toastText"></span>
      <button id="undo">Undo</button>
    </div>
  </main>

  <template id="row">
    <li class="game">
      <button class="check" aria-label="Mark as played"></button>
      <a class="open" target="_blank" rel="noopener">
        <span class="key"></span>
        <span class="text">
          <span class="name"></span>
          <span class="blurb"></span>
        </span>
        <span class="streak"></span>
        <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
